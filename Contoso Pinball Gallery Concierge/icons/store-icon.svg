<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192" role="img" aria-labelledby="title desc">
  <title id="title">Contoso Pinball Gallery Concierge store icon</title>
  <desc id="desc">A rounded-square app icon showing a stylized pinball ball, flippers, and the letter C for Concierge, for the Teams and Microsoft 365 store.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a5db0"/>
      <stop offset="1" stop-color="#173a78"/>
    </linearGradient>
    <radialGradient id="ball2" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#cdd6e2"/>
      <stop offset="1" stop-color="#8b95a6"/>
    </radialGradient>
  </defs>

  <!-- app tile -->
  <rect x="8" y="8" width="176" height="176" rx="40" fill="url(#tile)"/>

  <!-- subtle top sheen -->
  <rect x="8" y="8" width="176" height="88" rx="40" fill="#ffffff" opacity="0.06"/>

  <!-- concierge C ring, doubles as playfield arch -->
  <path d="M132 58 A46 46 0 1 0 132 134" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>

  <!-- ball inside the C -->
  <circle cx="96" cy="96" r="20" fill="url(#ball2)"/>
  <circle cx="96" cy="96" r="20" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.7"/>

  <!-- flippers at the base -->
  <g stroke="#173a78" stroke-width="2" stroke-linejoin="round">
    <path d="M70 150 L98 164 L96 154 L74 140 Z" fill="#f2b134"/>
    <path d="M122 150 L94 164 L96 154 L118 140 Z" fill="#f2b134"/>
  </g>
</svg>
